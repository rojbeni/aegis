version: '3.8'

services:
  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegis}
    networks:
      - aegis-net
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    networks:
      - aegis-net
    deploy:
      restart_policy:
        condition: on-failure

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    volumes:
      - o2_data:/data
    networks:
      - aegis-net

  vector:
    image: timberio/vector:0.34.X-debian
    container_name: vector
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - openobserve
    networks:
      - aegis-net

  aegis:
    image: rojbeni/aegis:latest
    environment:
      - DATABASE_URL=postgresql://aegis:${DB_PASSWORD:-aegis}@postgres:5432/aegis
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://187.127.225.175}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOG_JSON=true
    networks:
      - aegis-net
    ports:
      - "8000:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  web:
    image: rojbeni/aegis-web:latest
    ports:
      - "80:80"
    networks:
      - aegis-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first

volumes:
  postgres_data:
  o2_data:

networks:
  aegis-net:
    driver: overlay
