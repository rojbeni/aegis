services:
  postgres:
    image: postgres:16
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"
    networks:
      - aegis-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - aegis-net

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    volumes:
      - o2_data:/data
    networks:
      - aegis-net

  vector:
    image: timberio/vector:0.34.X-debian
    container_name: vector
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - openobserve
    networks:
      - aegis-net

  aegis:
    build: .
    container_name: aegis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis:aegis@postgres:5432/aegis
      - FRONTEND_ORIGIN=http://localhost:5173
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - LOG_JSON=true
    networks:
      - aegis-net

  web:
    image: rojbeni/aegis-web:latest
    container_name: aegis-web
    ports:
      - "80:80"
    networks:
      - aegis-net
    profiles:
      - disabled

volumes:
  postgres_data:
  o2_data:

networks:
  aegis-net:
    driver: bridge
